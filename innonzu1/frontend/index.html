<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innonzu — by Innovatoor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0A0913;
            --bg-soft: #0F0D1B;
            --surface: #151223;
            --surface-2: #1C1832;
            --text: #F5F3FF;
            --text-soft: #9C93BE;
            --header-bg: rgba(10, 9, 19, .72);
            --accent: #C9B8FF;
            --accent-strong: #9B7EFF;
            --accent-soft-bg: rgba(201, 184, 255, .14);
            --accent-contrast: #13101F;
            --white: #FFFFFF;
            --line: rgba(255, 255, 255, .10);
            --line-strong: rgba(255, 255, 255, .20);
            --danger: #FF8A8A;
            --danger-bg: rgba(255, 110, 110, .14);
            --glow: 0 0 0 1px rgba(201, 184, 255, .28), 0 10px 34px rgba(155, 126, 255, .22);
            --radius-s: 10px;
            --radius-m: 16px;
            --radius-l: 26px;
            --font-d: 'Space Grotesk', sans-serif;
            --font-b: 'Manrope', sans-serif;
        }
        
         :root:not([data-theme="dark"]) {
            @media (prefers-color-scheme: light) {
                --bg: #F6F4FC;
                --bg-soft: #FFFFFF;
                --surface: #FFFFFF;
                --surface-2: #F1EDFB;
                --text: #161328;
                --text-soft: #67608A;
                --header-bg: rgba(255, 255, 255, .78);
                --accent: #7C5CFC;
                --accent-strong: #6944F0;
                --accent-soft-bg: rgba(124, 92, 252, .10);
                --accent-contrast: #FFFFFF;
                --white: #FFFFFF;
                --line: #E6E0FA;
                --line-strong: #D3C7F6;
                --danger: #C23B3B;
                --danger-bg: #FBEAEA;
                --glow: 0 0 0 1px rgba(124, 92, 252, .16), 0 10px 26px rgba(124, 92, 252, .12);
            }
        }
        
         :root[data-theme="light"] {
            --bg: #F6F4FC;
            --bg-soft: #FFFFFF;
            --surface: #FFFFFF;
            --surface-2: #F1EDFB;
            --text: #161328;
            --text-soft: #67608A;
            --header-bg: rgba(255, 255, 255, .78);
            --accent: #7C5CFC;
            --accent-strong: #6944F0;
            --accent-soft-bg: rgba(124, 92, 252, .10);
            --accent-contrast: #FFFFFF;
            --white: #FFFFFF;
            --line: #E6E0FA;
            --line-strong: #D3C7F6;
            --danger: #C23B3B;
            --danger-bg: #FBEAEA;
            --glow: 0 0 0 1px rgba(124, 92, 252, .16), 0 10px 26px rgba(124, 92, 252, .12);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-b);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        h1,
        h2,
        h3,
        .f-d {
            font-family: var(--font-d);
        }
        
        a {
            color: inherit;
        }
        
        img {
            max-width: 100%;
            display: block;
        }
        
        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }
        
        button {
            cursor: pointer;
        }
        
         :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .wrap-x {
            overflow-x: auto;
        }
        /* header */
        
        .site-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
        }
        
        .nav {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 20px;
            max-width: 1180px;
            margin: 0 auto;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-d);
            font-weight: 700;
            font-size: 1.28rem;
            letter-spacing: -0.01em;
            white-space: nowrap;
            background: none;
            border: none;
            padding: 0;
            color: var(--text);
        }
        
        .logo .nn {
            background: linear-gradient(120deg, var(--accent), var(--accent-strong));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .logo .by-line {
            font-family: var(--font-b);
            font-size: .66rem;
            font-weight: 700;
            color: var(--text-soft);
            letter-spacing: .01em;
            margin-left: 8px;
            padding-top: 3px;
        }
        
        .logo svg {
            flex-shrink: 0;
            color: var(--accent);
        }
        
        .navlinks {
            display: flex;
            gap: 4px;
            flex: 1;
            flex-wrap: wrap;
        }
        
        .navlink {
            background: none;
            border: none;
            color: var(--text-soft);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: .94rem;
            font-weight: 600;
        }
        
        .navlink[aria-current="true"] {
            color: var(--text);
            background: var(--accent-soft-bg);
        }
        
        .navlink:hover {
            color: var(--text);
        }
        
        .navactions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        
        .icon-btn {
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        /* buttons */
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: .95rem;
            border: 1px solid transparent;
            transition: transform .12s ease, border-color .15s ease, filter .15s ease;
        }
        
        .btn:active {
            transform: scale(.98);
        }
        
        .btn-accent {
            background: linear-gradient(120deg, var(--accent), var(--accent-strong));
            color: var(--accent-contrast);
            box-shadow: var(--glow);
        }
        
        .btn-accent:hover {
            filter: brightness(1.07);
        }
        
        .btn-dark {
            background: var(--surface-2);
            color: var(--text);
            border-color: var(--line-strong);
        }
        
        .btn-dark:hover {
            border-color: var(--accent);
        }
        
        .btn-outline {
            background: transparent;
            border-color: var(--line-strong);
            color: var(--text);
        }
        
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--text-soft);
            padding: 10px 14px;
        }
        
        .btn-ghost:hover {
            color: var(--text);
        }
        
        .btn-sm {
            padding: 8px 14px;
            font-size: .85rem;
        }
        
        .btn-block {
            width: 100%;
        }
        
        .btn[disabled] {
            opacity: .5;
            cursor: default;
        }
        
        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }
        /* hero */
        
        .hero {
            position: relative;
            padding: 56px 0 40px;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -140px;
            right: -100px;
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, var(--accent-strong) 0%, transparent 70%);
            opacity: .30;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }
        
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--line-strong) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: .45;
            -webkit-mask-image: linear-gradient(to bottom, black, transparent 82%);
            mask-image: linear-gradient(to bottom, black, transparent 82%);
            pointer-events: none;
            z-index: 0;
        }
        
        @media (prefers-reduced-motion: no-preference) {
            .hero::before {
                animation: drift 16s ease-in-out infinite alternate;
            }
        }
        
        @keyframes drift {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-40px, 26px);
            }
        }
        
        .hero .container {
            position: relative;
            z-index: 1;
        }
        
        .hero-grid {
            display: grid;
            grid-template-columns: 1.25fr .85fr;
            gap: 44px;
            align-items: start;
        }
        
        @media (max-width:860px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .eyebrow-note {
            font-size: .82rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft-bg);
            border: 1px solid var(--line-strong);
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
        }
        
        h1.hero-h {
            font-size: clamp(1.9rem, 4vw, 2.8rem);
            line-height: 1.12;
            margin: 0 0 14px;
            letter-spacing: -0.01em;
            background: linear-gradient(100deg, var(--text) 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .hero-sub {
            color: var(--text-soft);
            font-size: 1.05rem;
            max-width: 52ch;
            margin: 0 0 26px;
        }
        
        .search-card {
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-l);
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .28);
        }
        
        .search-row {
            display: flex;
            gap: 10px;
        }
        
        @media (max-width:520px) {
            .search-row {
                flex-direction: column;
            }
        }
        
        .search-input {
            flex: 1;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-m);
            padding: 14px 16px;
            background: var(--surface-2);
            color: var(--text);
        }
        
        .search-hint {
            font-size: .82rem;
            color: var(--text-soft);
            margin-top: 10px;
        }
        
        .type-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .chip {
            border: 1px solid var(--line-strong);
            background: var(--surface-2);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .86rem;
        }
        
        .chip[aria-pressed="true"] {
            background: var(--accent-soft-bg);
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .trust-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
        }
        
        .trust-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 14px 16px;
            border-radius: var(--radius-m);
        }
        
        .trust-item svg {
            flex-shrink: 0;
            margin-top: 2px;
            color: var(--accent);
        }
        
        .trust-item b {
            display: block;
            font-size: .95rem;
        }
        
        .trust-item span {
            color: var(--text-soft);
            font-size: .86rem;
        }
        /* filter bar */
        
        .filter-bar {
            position: sticky;
            top: 66px;
            z-index: 30;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            padding: 14px 0;
        }
        
        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 4px;
            border-radius: 999px;
        }
        
        .tab {
            border: none;
            background: none;
            padding: 9px 16px;
            border-radius: 999px;
            font-weight: 700;
            font-size: .88rem;
            color: var(--text-soft);
        }
        
        .tab[aria-selected="true"] {
            background: linear-gradient(120deg, var(--accent), var(--accent-strong));
            color: var(--accent-contrast);
        }
        
        .result-count {
            color: var(--text-soft);
            font-size: .88rem;
            margin-left: auto;
        }
        
        .ai-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft-bg);
            color: var(--accent);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: .82rem;
            font-weight: 700;
            margin-top: 10px;
        }
        /* grid + cards */
        
        .section {
            padding: 32px 0;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-m);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: left;
            padding: 0;
            transition: border-color .18s ease;
        }
        
        .card:hover {
            border-color: var(--accent-strong);
        }
        
        .card-photo {
            position: relative;
            aspect-ratio: 4/3;
            background: var(--surface-2);
            overflow: hidden;
        }
        
        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-badges {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .badge {
            font-size: .72rem;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(10, 9, 19, .7);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, .14);
            backdrop-filter: blur(6px);
        }
        
        .badge-verified {
            background: var(--accent-soft-bg);
            color: var(--accent);
            border-color: transparent;
            backdrop-filter: none;
        }
        
        .badge-type {
            background: rgba(10, 9, 19, .7);
            color: var(--white);
        }
        
        .card-price {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(10, 9, 19, .86);
            color: #fff;
            font-family: var(--font-d);
            font-weight: 700;
            padding: 6px 12px;
            border-radius: var(--radius-s);
            font-size: .95rem;
            border: 1px solid rgba(255, 255, 255, .12);
        }
        
        .card-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        
        .card-title {
            font-weight: 700;
            font-size: 1rem;
        }
        
        .card-loc {
            color: var(--text-soft);
            font-size: .85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .card-meta {
            display: flex;
            gap: 12px;
            color: var(--text-soft);
            font-size: .82rem;
            margin-top: 4px;
            border-top: 1px solid var(--line);
            padding-top: 10px;
        }
        
        .card-reason {
            font-size: .78rem;
            color: var(--accent);
            background: var(--accent-soft-bg);
            padding: 6px 9px;
            border-radius: var(--radius-s);
            margin-top: 6px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-soft);
        }
        
        .empty-state svg {
            margin-bottom: 14px;
            color: var(--line-strong);
        }
        /* detail page */
        
        .detail-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 0 6px;
            color: var(--text-soft);
            font-size: .9rem;
        }
        
        .gallery {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-l);
            overflow: hidden;
        }
        
        .gallery-main {
            aspect-ratio: 16/10;
            background: var(--surface-2);
        }
        
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .gallery-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 12px;
            border-top: 1px solid var(--line);
        }
        
        .gtab {
            white-space: nowrap;
            border: 1px solid var(--line-strong);
            background: var(--surface-2);
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: .83rem;
            color: var(--text);
        }
        
        .gtab[aria-selected="true"] {
            background: var(--accent-soft-bg);
            color: var(--accent);
            border-color: var(--accent);
        }
        
        .thumb-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 12px 12px;
        }
        
        .thumb {
            width: 76px;
            height: 56px;
            border-radius: var(--radius-s);
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid transparent;
            background: var(--surface-2);
        }
        
        .thumb[aria-current="true"] {
            border-color: var(--accent);
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 28px;
            margin-top: 24px;
            align-items: start;
        }
        
        @media (max-width:860px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .spec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 18px 0;
        }
        
        .spec-item {
            border: 1px solid var(--line);
            border-radius: var(--radius-m);
            padding: 12px 14px;
            background: var(--surface);
        }
        
        .spec-item .k {
            color: var(--text-soft);
            font-size: .78rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .spec-item .v {
            font-weight: 700;
            margin-top: 3px;
        }
        
        .owner-card {
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-l);
            padding: 20px;
            background: var(--surface);
            position: sticky;
            top: 150px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .24);
        }
        
        .price-big {
            font-family: var(--font-d);
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(120deg, var(--text), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .price-big small {
            font-family: var(--font-b);
            font-size: .9rem;
            color: var(--text-soft);
            font-weight: 600;
            -webkit-text-fill-color: var(--text-soft);
        }
        /* wizard */
        
        .stepper {
            display: flex;
            gap: 0;
            margin: 22px 0 30px;
        }
        
        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        
        .step .dot {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--surface-2);
            border: 2px solid var(--line-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            margin: 0 auto 6px;
            color: var(--text-soft);
        }
        
        .step.active .dot {
            background: linear-gradient(120deg, var(--accent), var(--accent-strong));
            border-color: var(--accent);
            color: var(--accent-contrast);
            box-shadow: var(--glow);
        }
        
        .step.done .dot {
            background: var(--accent-soft-bg);
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .step .lbl {
            font-size: .76rem;
            color: var(--text-soft);
            font-weight: 600;
        }
        
        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 56%;
            width: 88%;
            height: 2px;
            background: var(--line-strong);
            z-index: -1;
        }
        
        .type-pick {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        
        @media (max-width:640px) {
            .type-pick {
                grid-template-columns: 1fr;
            }
        }
        
        .type-card {
            border: 2px solid var(--line);
            background: var(--surface);
            border-radius: var(--radius-l);
            padding: 22px 18px;
            text-align: left;
            transition: border-color .18s ease;
        }
        
        .type-card:hover {
            border-color: var(--accent);
        }
        
        .type-card svg {
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .type-card b {
            display: block;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }
        
        .type-card span {
            color: var(--text-soft);
            font-size: .85rem;
        }
        
        .field {
            margin-bottom: 16px;
        }
        
        .field .label {
            display: block;
