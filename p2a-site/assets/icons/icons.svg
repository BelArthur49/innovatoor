    <!-- Population icon (people) -->
    <symbol id="icon-population" viewBox="0 0 24 24">
      <circle cx="8.5" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="16" cy="9" r="2.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3.2 19.5c.5-3.3 2.6-5.3 5.3-5.3s4.8 2 5.3 5.3M14 15.4c2.1.2 3.6 1.8 4 4.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>

    <!-- Supply/box icon -->
    <symbol id="icon-supply" viewBox="0 0 24 24">
      <path d="M12 3.4l8 4.2v8.8l-8 4.2-8-4.2V7.6l8-4.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M4 7.6l8 4.2 8-4.2M12 11.8V20.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>

    <!-- Syringe icon -->
    <symbol id="icon-syringe" viewBox="0 0 24 24">
      <path d="M20 4l-2.3 2.3M15.5 3.5l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16.8 6.7L7.4 16.1l-3 4.6 4.6-3 9.4-9.4-1.6-1.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M11 12.5l2.5 2.5M13.3 10.2l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>

    <!-- Photo placeholder: camera outline -->
    <symbol id="icon-photo" viewBox="0 0 24 24">
      <path d="M4 8.2h2.6l1.2-2h8.4l1.2 2H20a1.3 1.3 0 0 1 1.3 1.3v9A1.3 1.3 0 0 1 20 19.8H4A1.3 1.3 0 0 1 2.7 18.5v-9A1.3 1.3 0 0 1 4 8.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="12" cy="13.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>

  </defs>
