<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <!-- Vaccine Hesitancy: head in profile with a question mark -->
    <symbol id="icon-hesitancy" viewBox="0 0 24 24">
      <path d="M8 21v-3.2c-2.4-1.3-4-3.7-4-6.5C4 6.8 7.8 3 12.5 3S21 6.8 21 11.3c0 2.7-1.3 5-3.3 6.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8.2" cy="10.4" r="0.9" fill="currentColor"/>
      <path d="M13.3 9.4c.2-.9 1-1.5 1.9-1.4.9.1 1.6.9 1.5 1.8-.1.7-.6 1.1-1.1 1.5-.5.4-.9.7-.9 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14.7" cy="14.6" r="0.35" fill="currentColor"/>
    </symbol>

    <!-- Cold chain & Logistics: truck + snowflake -->
    <symbol id="icon-logistics" viewBox="0 0 24 24">
      <path d="M2.5 15.5V7.8h9.7v7.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.2 10.4h4l3.3 3.2v2h-7.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6.2" cy="17.2" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="16.3" cy="17.2" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M19.4 4.2v4.4M17.4 5.4l4 2M21.4 5.4l-4 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>

    <!-- Poverty: coin with a falling/minus line -->
    <symbol id="icon-poverty" viewBox="0 0 24 24">
      <circle cx="10.5" cy="9.5" r="6.3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10.5 6.4v6.2M8.6 11.3c.2.9 1 1.4 1.9 1.4 1.1 0 2-.6 2-1.6 0-1-.9-1.3-2-1.6-1-.3-1.9-.6-1.9-1.6 0-.9.9-1.5 1.9-1.5.8 0 1.5.4 1.8 1.1" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M4.5 18.5l14-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>

    <!-- Vaccines on verge of expiry: vial + clock -->
    <symbol id="icon-expired" viewBox="0 0 24 24">
      <path d="M8.5 2.8h5.2M9.6 2.8v3.6l-2.6 4.3c-.6 1-.9 2.1-.9 3.2v5.9c0 1.2 1 2.2 2.2 2.2h4.6c1.2 0 2.2-1 2.2-2.2v-5.9c0-1.1-.3-2.2-.9-3.2l-2.6-4.3V2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.6 15.4h8.6" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="17.8" cy="16.6" r="4" fill="var(--icon-bg,#fff)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M17.8 14.6v2.1l1.5 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Fake news: speech bubble with exclamation -->
    <symbol id="icon-fakenews" viewBox="0 0 24 24">
      <path d="M3.5 5.5h14a2 2 0 0 1 2 2v6.2a2 2 0 0 1-2 2H10l-4.2 3.4v-3.4H3.5a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M10.5 8.6v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="10.5" cy="14.1" r="0.4" fill="currentColor"/>
    </symbol>

    <!-- Political instability / conflict: shield with crack -->
    <symbol id="icon-conflict" viewBox="0 0 24 24">
      <path d="M12 2.8l7.2 2.6v6.1c0 4.6-3 7.9-7.2 9.7-4.2-1.8-7.2-5.1-7.2-9.7V5.4L12 2.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12.6 6.5l-2 5h2.1l-2 5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

