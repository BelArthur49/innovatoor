      <path d="M9.3 9.6l1.9 1.9 3.5-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Health practitioner labour strikes: megaphone -->
    <symbol id="icon-strikes" viewBox="0 0 24 24">
      <path d="M3 10.2v3.6h2.6L12 17.6V6.4L5.6 10.2H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M15 8.6a4 4 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M17.4 6.3a7.6 7.6 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M6.4 13.8v3.6a1.4 1.4 0 0 0 2.8 0v-2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Facilitator / good-practice: handshake-ish, simplified as linked circles + check -->
    <symbol id="icon-facilitator" viewBox="0 0 24 24">
      <circle cx="8" cy="9" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="16" cy="9" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M4.8 20c.5-2.7 2.1-4.4 5.2-4.4M19.2 20c-.5-2.7-2.1-4.4-5.2-4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M9.8 9.2l1.5 1.5 2.9-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Generic small chevron for "read more" links -->
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="M9 5.5l6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Generic external-link -->
    <symbol id="icon-external" viewBox="0 0 24 24">
      <path d="M9 6H5.5A1.5 1.5 0 0 0 4 7.5v11A1.5 1.5 0 0 0 5.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15M14 4h6v6M20 4l-9.5 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
